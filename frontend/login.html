<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🛡️ Threatline ETIP — Analyst Authentication Portal</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300e5ff'><path d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/></svg>">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at center, rgba(0, 229, 255, 0.05) 0%, rgba(7, 9, 14, 0.95) 70%);
    }
    .auth-card {
      max-width: 460px;
      width: 100%;
      background: var(--card);
      border: 1px solid rgba(0, 229, 255, 0.3);
      border-radius: var(--radius-xl);
      padding: 36px;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.85), var(--shadow-glow-cyan);
      position: relative;
      overflow: hidden;
    }
    .auth-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #00e5ff, #3b82f6, #a855f7);
    }
    .quick-acc-chip {
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 11.5px;
      font-family: var(--font-mono);
      color: var(--cyan);
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .quick-acc-chip:hover {
      background: var(--cyan-dim);
      border-color: var(--cyan);
    }
  </style>
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    
    <!-- Branding Header with Cyber Shield Logo -->
    <div style="display:flex; align-items:center; gap:14px; margin-bottom:24px;">
      <div class="nav-logo-icon" style="width:44px; height:44px;">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="M9 12l2 2 4-4"/>
        </svg>
      </div>
      <div>
        <h2 style="font-size:19px; letter-spacing:0.02em;">THREATLINE ETIP</h2>
        <div class="sub mono" style="color:var(--cyan); font-size:11px; letter-spacing:0.08em;">SOC ANALYST COMMAND ACCESS</div>
      </div>
    </div>

    <!-- Quick Account Selector Chips -->
    <div style="margin-bottom:20px;">
      <div style="font-size:11px; font-family:var(--font-mono); color:var(--text-low); text-transform:uppercase; margin-bottom:8px;">
        Instant One-Click Credentials:
      </div>
      <div style="display:flex; flex-direction:column; gap:6px;">
        <div class="quick-acc-chip" onclick="fillCredentials('vaisham@gmail.com', 'vaisham@1234')">
          <span>👑 <strong>Vaishampayan (Admin)</strong></span>
          <span class="mono" style="color:var(--text-mid);">vaisham@gmail.com</span>
        </div>
        <div class="quick-acc-chip" onclick="fillCredentials('analyst@cybersec.org', 'Password123!')">
          <span>🛡️ <strong>CyberSec Tier-2</strong></span>
          <span class="mono" style="color:var(--text-mid);">analyst@cybersec.org</span>
        </div>
      </div>
    </div>

    <!-- Login Form -->
    <form onsubmit="handleLogin(event)">
      <div class="input-group">
        <label class="input-label">Analyst Email</label>
        <input type="email" class="input-control mono" id="loginEmail" placeholder="vaisham@gmail.com" required value="vaisham@gmail.com" />
      </div>

      <div class="input-group">
        <label class="input-label">Security Password</label>
        <input type="password" class="input-control mono" id="loginPassword" placeholder="••••••••" required value="vaisham@1234" />
      </div>

      <button type="submit" class="btn btn-primary" id="loginBtn" style="width:100%; margin-top:8px; padding:11px 16px;">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Authenticate to SOC Console →
      </button>

      <button type="button" class="btn btn-outline" onclick="handleGuestLogin()" style="width:100%; margin-top:10px;">
        🚀 Quick Analyst Demo Access (Guest Mode)
      </button>
    </form>

    <div style="margin-top:24px; text-align:center; font-size:12.5px; color:var(--text-mid);">
      Need a new account? <a href="signup.html" style="font-weight:600;">Register New Analyst</a>
    </div>
  </div>
</div>

<script src="assets/api.js"></script>
<script src="assets/app.js"></script>
<script>
function fillCredentials(email, pass) {
  document.getElementById('loginEmail').value = email;
  document.getElementById('loginPassword').value = pass;
  notify(`Credentials prefilled for ${email}`, 'info');
}

async function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value.trim();
  const btn = document.getElementById('loginBtn');

  btn.disabled = true;
  btn.textContent = 'Authenticating with Gateway...';

  try {
    await AuthAPI.login(email, password);
    notify('Authentication successful. Welcome Analyst.', 'success');
    setTimeout(() => { window.location.href = 'index.html'; }, 300);
  } catch (err) {
    btn.disabled = false;
    btn.innerHTML = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> Authenticate to SOC Console →`;
    notify(err.message || 'Login failed. Please check credentials.', 'error');
  }
}

async function handleGuestLogin() {
  await AuthAPI.guestLogin();
  notify('Entering SOC Console in Analyst Demo Mode.', 'info');
  setTimeout(() => { window.location.href = 'index.html'; }, 200);
}
</script>
</body>
</html>
