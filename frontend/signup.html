<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🛡️ Create Analyst Account — Threatline ETIP</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300e5ff'><path d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/></svg>">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .auth-card {
      max-width: 440px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 36px;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.8), var(--shadow-glow-cyan);
    }
  </style>
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <div style="display:flex; align-items:center; gap:12px; margin-bottom:24px;">
      <div class="nav-logo-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="M9 12l2 2 4-4"/>
        </svg>
      </div>
      <div>
        <h2 style="font-size:18px;">CREATE ACCOUNT</h2>
        <div class="sub mono" style="color:var(--cyan); font-size:10.5px;">PROVISION SOC ANALYST CREDENTIALS</div>
      </div>
    </div>

    <form onsubmit="handleSignup(event)">
      <div class="input-group">
        <label class="input-label">Full Name</label>
        <input type="text" class="input-control" id="regName" placeholder="Alex Morgan" required />
      </div>

      <div class="input-group">
        <label class="input-label">Analyst Email</label>
        <input type="email" class="input-control" id="regEmail" placeholder="analyst@soc.corp" required />
      </div>

      <div class="input-group">
        <label class="input-label">Security Password</label>
        <input type="password" class="input-control" id="regPassword" placeholder="Minimum 6 characters" minlength="6" required />
      </div>

      <button type="submit" class="btn btn-primary" id="regBtn" style="width:100%; margin-top:8px;">
        Provision Account & Enter →
      </button>
    </form>

    <div style="margin-top:24px; text-align:center; font-size:12.5px; color:var(--text-mid);">
      Already provisioned? <a href="login.html" style="font-weight:600;">Sign in to SOC Console</a>
    </div>
  </div>
</div>

<script src="assets/api.js"></script>
<script src="assets/app.js"></script>
<script>
async function handleSignup(e) {
  e.preventDefault();
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value.trim();
  const btn = document.getElementById('regBtn');

  btn.disabled = true;
  btn.textContent = 'Provisioning...';

  try {
    await AuthAPI.signup(name, email, password);
    notify('Analyst account created successfully.', 'success');
    setTimeout(() => { window.location.href = 'index.html'; }, 300);
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'Provision Account & Enter →';
    notify(err.message || 'Signup failed.', 'error');
  }
}
</script>
</body>
</html>
